<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Minisplits</title>

<script src="productos.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f2f2;
}

header{
background:#0d47a1;
color:white;
padding:20px;
text-align:center;
}

header p{
margin:8px 0 0;
}

#catalogo{
max-width:900px;
margin:auto;
padding:15px;
}

.tarjeta{
background:white;
border-radius:15px;
overflow:hidden;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.tarjeta img{
width:100%;
height:240px;
object-fit:cover;
}

.info{
padding:15px;
}

.info h2{
margin-top:0;
}

.precio{
font-size:32px;
font-weight:bold;
color:#0d47a1;
margin:15px 0;
}

button{
width:100%;
padding:15px;
background:#28a745;
color:white;
font-size:18px;
font-weight:bold;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<h1>Catálogo de Minisplits</h1>

<p>Elige el modelo ideal para tu hogar</p>

</header>

<div id="catalogo"></div>

<script>

const contenedor=document.getElementById("catalogo");

productos.forEach(producto=>{

contenedor.innerHTML+=`

<div class="tarjeta">

<img src="${producto.fotos[0]}">

<div class="info">

<h2>${producto.nombre}</h2>

<p><b>Marca:</b> ${producto.marca}</p>

<p><b>Capacidad:</b> ${producto.toneladas}</p>

<p><b>Voltaje:</b> ${producto.voltaje}</p>

<div class="precio">

$${producto.precio}

</div>

<p>${producto.descripcion}</p>

<button onclick="location.href='producto.html?id=${producto.id}'">

Ver producto

</button>

</div>

</div>

`;

});
  
</script>

</body>
</html>
