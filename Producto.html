<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto</title>

<script src="productos.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#0d47a1;
color:white;
text-align:center;
padding:18px;
}

.contenedor{
max-width:900px;
margin:auto;
padding:15px;
}

#foto{
width:100%;
height:300px;
object-fit:cover;
border-radius:15px;
background:#ddd;
}

.galeria{
display:flex;
gap:10px;
margin-top:10px;
margin-bottom:20px;
overflow:auto;
}

.galeria img{
width:90px;
height:90px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
border:2px solid #ddd;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.precio{
font-size:34px;
font-weight:bold;
color:#0d47a1;
margin:15px 0;
}

.pedir{
position:fixed;
left:20px;
right:20px;
bottom:20px;
padding:18px;
background:#28a745;
color:white;
border:none;
border-radius:50px;
font-size:22px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<h1 id="nombre"></h1>

</header>

<div class="contenedor">

<img id="foto">

<div class="galeria" id="galeria"></div>

<div class="card">

<h2 id="marca"></h2>

<p id="toneladas"></p>

<p id="voltaje"></p>

<div class="precio" id="precio"></div>

<p id="descripcion"></p>

</div>

</div>

<button class="pedir">
📲 Solicitar instalación
</button>

<script>
    const params = new URLSearchParams(window.location.search);
const id = Number(params.get("id")) || 1;

const producto = productos.find(p => p.id === id);

if(producto){

document.getElementById("nombre").textContent = producto.nombre;
document.getElementById("marca").textContent = "Marca: " + producto.marca;
document.getElementById("toneladas").textContent = "Capacidad: " + producto.toneladas;
document.getElementById("voltaje").textContent = "Voltaje: " + producto.voltaje;
document.getElementById("precio").textContent = "$" + producto.precio;
document.getElementById("descripcion").textContent = producto.descripcion;

document.getElementById("foto").src = producto.fotos[0];

const galeria = document.getElementById("galeria");

producto.fotos.forEach(foto=>{

galeria.innerHTML += `
<img src="${foto}" onclick="document.getElementById('foto').src='${foto}'">
`;

});

}

document.querySelector(".pedir").onclick=function(){

location.href="pedido.html?id="+id;

};

</script>

</body>
</html>
