<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de Minisplits</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>Catálogo de Minisplits</h1>
</header>

<div class="container">

<h2>Agregar Minisplit</h2>

<input id="nombre" placeholder="Nombre">
<input id="marca" placeholder="Marca">
<input id="toneladas" placeholder="Toneladas">
<input id="voltaje" placeholder="Voltaje">
<input id="precio" placeholder="Precio">

<textarea id="descripcion" placeholder="Descripción"></textarea>

<label>Foto 1</label>
<input type="file" id="foto1" accept="image/*">

<label>Foto 2</label>
<input type="file" id="foto2" accept="image/*">

<label>Foto 3</label>
<input type="file" id="foto3" accept="image/*">

<button onclick="agregar()">Agregar</button>

<hr>

<div id="productos"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
