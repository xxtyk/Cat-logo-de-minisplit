<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitar instalación</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#0d47a1;
color:#fff;
text-align:center;
padding:20px;
}

.contenedor{
max-width:500px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.producto{
background:#e3f2fd;
border-left:5px solid #0d47a1;
padding:15px;
border-radius:10px;
margin-bottom:20px;
line-height:1.7;
}

.aviso{
background:#e8f5e9;
border-left:5px solid #2e7d32;
padding:15px;
margin-bottom:20px;
border-radius:10px;
line-height:1.6;
}

input,textarea{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:16px;
font-size:20px;
background:#28a745;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<h1>Solicitar instalación</h1>

</header>

<div class="contenedor">

<div class="producto">

<b>Minisplit seleccionado</b>

<p id="nombreProducto"></p>
<p id="marcaProducto"></p>
<p id="toneladasProducto"></p>
<p id="voltajeProducto"></p>
<p id="precioProducto"></p>

</div>

<div class="aviso">

📲 <b>Después de enviar tu pedido, te enviaremos un WhatsApp para confirmar tu solicitud, resolver cualquier duda y ponernos de acuerdo sobre la fecha y hora de la instalación de tu minisplit.</b>

</div>

<input id="nombre" type="text" placeholder="Nombre">

<input id="whatsapp" type="text" placeholder="WhatsApp">

<input id="telefono" type="text" placeholder="Teléfono">

<input id="direccion" type="text" placeholder="Dirección">

<input id="colonia" type="text" placeholder="Colonia">

<textarea id="comentarios" placeholder="Comentarios (opcional)"></textarea>

<button onclick="enviarPedido()">
📲 Enviar pedido
</button>

</div>

<script>

const params=new URLSearchParams(window.location.search);

const nombreProducto=params.get("nombre")||"";
const marca=params.get("marca")||"";
const toneladas=params.get("toneladas")||"";
const voltaje=params.get("voltaje")||"";
const precio=params.get("precio")||"";

document.getElementById("nombreProducto").innerHTML="<b>Modelo:</b> "+nombreProducto;
document.getElementById("marcaProducto").innerHTML="<b>Marca:</b> "+marca;
document.getElementById("toneladasProducto").innerHTML="<b>Capacidad:</b> "+toneladas;
document.getElementById("voltajeProducto").innerHTML="<b>Voltaje:</b> "+voltaje;
document.getElementById("precioProducto").innerHTML="<b>Precio:</b> $"+precio;

function enviarPedido(){

const nombre=document.getElementById("nombre").value;
const whatsapp=document.getElementById("whatsapp").value;
const telefono=document.getElementById("telefono").value;
const direccion=document.getElementById("direccion").value;
const colonia=document.getElementById("colonia").value;
const comentarios=document.getElementById("comentarios").value;

const mensaje=`📦 *NUEVO PEDIDO DE INSTALACIÓN*

❄️ Minisplit: ${nombreProducto}

🏷️ Marca: ${marca}

💨 Capacidad: ${toneladas}

⚡ Voltaje: ${voltaje}

💰 Precio: $${precio}

👤 Nombre: ${nombre}

📲 WhatsApp: ${whatsapp}

☎️ Teléfono: ${telefono}

📍 Dirección: ${direccion}

🏠 Colonia: ${colonia}

📝 Comentarios: ${comentarios}`;

window.open("https://wa.me/526679771409?text="+encodeURIComponent(mensaje),"_blank");

setTimeout(function(){

location.href="pedido_recibido.html";

},1000);

}

</script>

</body>
</html>
