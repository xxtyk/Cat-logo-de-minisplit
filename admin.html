<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrador de Minisplits</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
<h1>Administrador de Minisplits</h1>
<p>Administrador</p>
</header>

<div class="contenedor">

<h2>Nuevo Minisplit</h2>

<input id="nombre" placeholder="Nombre">

<input id="marca" placeholder="Marca">

<input id="toneladas" placeholder="Toneladas">

<input id="voltaje" placeholder="Voltaje">

<input id="precio" placeholder="Precio">

<textarea id="descripcion" placeholder="Descripción"></textarea>

<label>Foto 1</label>
<input type="file" id="foto1">

<label>Foto 2</label>
<input type="file" id="foto2">

<label>Foto 3</label>
<input type="file" id="foto3">

<br><br>

<button onclick="agregar()">
Guardar Minisplit
</button>

<hr>

<h2>Productos Guardados</h2>

<div id="productos"></div>

</div>

<script src="productos.js"></script>

<script>

productos = productos || [];

function agregar(){

const producto = {

id: productos.length + 1,

nombre: document.getElementById("nombre").value,

marca: document.getElementById("marca").value,

toneladas: document.getElementById("toneladas").value,

voltaje: document.getElementById("voltaje").value,

precio: document.getElementById("precio").value,

descripcion: document.getElementById("descripcion").value,

fotos:[
"https://via.placeholder.com/800x500",
"https://via.placeholder.com/800x500",
"https://via.placeholder.com/800x500"
]

};

productos.push(producto);

document.getElementById("productos").innerHTML += `

<div style="border:1px solid #ccc;border-radius:12px;padding:15px;margin:15px 0;">

<h3>${producto.nombre}</h3>

<p><b>Marca:</b> ${producto.marca}</p>

<p><b>Toneladas:</b> ${producto.toneladas}</p>

<p><b>Voltaje:</b> ${producto.voltaje}</p>

<p><b>Precio:</b> $${producto.precio}</p>

<p>${producto.descripcion}</p>

</div>

`;

alert("Minisplit guardado");

}

</script>

</body>
</html>
